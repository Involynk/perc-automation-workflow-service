# SERVICE_CONNECTIONS.yaml — workflow-service
# Format mirrors the master SERVICE_CONNECTIONS_MAP.yaml at the repo root.

service: workflow-service
description: >
  Lead pipeline state machine engine (NEW → INTERACTING → MEETING_SCHEDULED → COMPLETED).
  Tracks lead status progression through CRM pipeline stages and manages workflow execution paths.

subscribes_to:
  - topic: perc.lead-events
    from_service: lead-capture-service
    filter: none
    action: "Creates or updates workflow instance for lead; sets initial state to NEW or ACTIVE"

  - topic: perc.meeting-events
    from_service: meeting-service
    filter: none
    action: "Transitions lead pipeline status to MEETING_SCHEDULED"

produces:
  - topic: perc.workflow.status-updated
    event: workflow.status.updated
    kafka_key: leadId
    payload_schema:
      eventId: string
      workflowId: string
      leadId: string
      previousStatus: string
      currentStatus: string
      updatedAt: string        # ISO 8601
    subscribers:
      - service: timeline-service
        filter: none
        action: "Logs WORKFLOW_STATUS_CHANGED audit entry in lead's journey timeline"
      - service: analytics-service
        filter: none
        action: "Records pipeline stage transition metrics"
